spring.application.name=email-platform

# --- Server ------------------------------------------------------------
# PORT is injected automatically by Render/Railway. 5000 is the local default.
server.port=${PORT:5000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Compression -------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- Database ----------------------------------------------------------
# Local development defaults to an embedded H2 file database.
# Production (profile "prod") uses PostgreSQL via DB_URL / DATABASE_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/emailplatform}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Connection pool (HikariCP) ----------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EmailPlatformHikariPool

# --- JWT ---------------------------------------------------------------
# IMPORTANT: the default is for local development only. Always set JWT_SECRET
# in production (Render/Railway/CI). It must be at least 32 characters.
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-email-platform-2024}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# --- Application -------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:5000}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Rate limiting -----------------------------------------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:300}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# --- Mail (SMTP) -------------------------------------------------------
# No credentials are committed to the repository. Set these in production.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

# --- Logging -----------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.emailplatform=${LOG_LEVEL:INFO}
spring.output.ansi.enabled=never

# --- OpenAPI / Swagger -------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
