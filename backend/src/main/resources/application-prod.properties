# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod.
# Uses PostgreSQL. The connection string can be supplied in two ways:
#   1. DATABASE_URL in "postgres://user:pass@host:5432/dbname" format (Render/Neon/Railway)
#   2. DB_URL / DB_USERNAME / DB_PASSWORD
# The DatabaseConfig bean converts DATABASE_URL into a JDBC URL automatically.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emailplatform}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:emailplatform}
spring.datasource.password=${DB_PASSWORD:emailplatform}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

springdoc.swagger-ui.enabled=true
