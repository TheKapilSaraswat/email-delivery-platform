# ============================================================================
# Email Delivery Platform - CI/CD
# Runs on every push to main (and pull requests):
#   1. Secret scan (gitleaks)
#   2. Backend lint (checkstyle) + tests + build (Maven)
#   3. Frontend build (Vite)
#   4. Production Docker image -> GHCR
#   5. Deploy hooks for Render, Railway and Vercel
#
# Required repository secrets:
#   - RENDER_DEPLOY_HOOK   (Render dashboard -> Services -> your service -> Deploy Hook)
#   - RAILWAY_TOKEN        (Railway -> Account Settings -> Tokens) + RAILWAY_SERVICE
#   - VERCEL_DEPLOY_HOOK   (Vercel project -> Settings -> Git -> Deploy Hooks)
# All are optional: the deploy steps are skipped when the secret is missing.
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Lint (checkstyle)
        run: mvn -B -Plint validate

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test & package
        run: mvn -B verify

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  docker-build:
    needs: [backend-lint, backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/email-platform-api" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ env.RENDER_DEPLOY_HOOK }}"

  deploy-railway:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          if [ -n "${RAILWAY_TOKEN}" ] && [ -n "${RAILWAY_SERVICE}" ]; then
            npx --yes @railway/cli redeploy --service "${RAILWAY_SERVICE}" --ci
          else
            echo "RAILWAY_TOKEN/RAILWAY_SERVICE not set - skipping Railway deploy"
          fi

  deploy-vercel:
    needs: frontend-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Trigger Vercel deploy hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ env.VERCEL_DEPLOY_HOOK }}"
